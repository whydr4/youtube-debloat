<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">

    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <img src="../Icon.png" width="96" height="96" alt="">
    <h1>YouTube Debloat</h1>
    <p class="status">
        <span class="dot"></span>
        <span class="state-unknown">Checking Safari…</span>
        <span class="state-on">Extension is on</span>
        <span class="state-off">Extension is off</span>
    </p>
    <p class="hint">
        No ads. No Shorts. Settings live in the toolbar button on youtube.com.
    </p>
    <button class="open-preferences">Open Safari Extensions…</button>
</body>
</html>
